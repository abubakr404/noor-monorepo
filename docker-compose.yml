version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: zikr-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: zikr
      POSTGRES_USER: zikr_user
      POSTGRES_PASSWORD: zikr_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
